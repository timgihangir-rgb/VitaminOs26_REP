[package]
name = "vitamin_os26"
version = "0.1.0"
edition = "2021"

[dependencies]
linked_list_allocator = "=0.10.6"
x86_64 = "=0.14.7"
spinning_top = "=0.2.5"
lock_api = "=0.4.13"

[build-dependencies]
cc = "1"

# Профиль ядра.
#
# Уровень оптимизации НЕ поднят выше 0 намеренно. При opt-level >= 1 ядро
# оптимизируется, и задача композитора (она одна пишет в кадровый буфер)
# начинает работать неверно: задача уходит в мусорный адрес, система зависает
# через несколько секунд после загрузки - не работают ни ввод, ни вывод.
# Проверено минимальным сценарием: любая запись из задачи композитора
# (даже в обычную память, не в кадр) при opt-level >= 1 приводит к зависанию,
# а при opt-level = 0 система работает устойчиво. Это давняя проблема ядра,
# не связанная с отдельными подсистемами, и она требует отдельной
# доработки планировщика или разметки MMIO.
#
# Скорость отрисовки поэтому набирается оптимизацией самого растеризатора
# (src/fb.rs), а не компилятора: палитра и цвета считаются один раз на строку
# текста, в кадр идёт одна крупная запись вместо тысяч мелких, кадровый буфер
# отображен с кэшированием. Панели и проверки при этом сохранены:
# debug-assertions, overflow-checks и cfg(debug_assertions) работают.
[profile.dev]
panic = "abort"
debug = true
opt-level = 0
debug-assertions = true
overflow-checks = true
incremental = false

[profile.release]
panic = "abort"
