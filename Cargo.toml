[package]
name = "vitamin_os26"
version = "0.1.0"
edition = "2021"

[dependencies]
linked_list_allocator = "=0.10.6"
x86_64 = "=0.14.7"
spinning_top = "=0.2.5"
lock_api = "=0.4.13"

[build-dependencies]
cc = "1"

# Профиль ядра.
#
# Раньше здесь стоял opt-level = 0 с предупреждением, что при оптимизации ядро
# зависает. Причина была не в MMIO и не в композиторе, а в трёх местах, где
# нарушался ABI - все три исправлены:
#
#  1. `x86_64::instructions::hlt()` объявлен как `options(nomem, ...)` - то
#     есть «не читает и не пишет память». Оптимизатор выносил из циклов вида
#     `loop { if kb_hit() {...}; hlt(); }` чтение разделяемого состояния наружу,
#     и цикл переставал замечать данные от обработчика прерывания. Свой
#     `crate::halt::hlt()` (src/halt.rs) объявляет только `nostack`.
#  2. Точка входа ядерной задачи получала rsp, кратный 16, а обычная
#     extern "C" функция ждёт rsp ≡ 8 (mod 16): компилятор раскладывал локалы
#     по movaps и падал на первом же кадре. То же - на user-стеке.
#  3. Обработчик таймера вызывал `schedule` без выравнивания стека (CPU при
#     прерывании в том же кольце стек не выравнивает).
#
# Скорость отрисовки по-прежнему набирается оптимизацией самого растеризатора
# (src/fb.rs): палитра и цвета считаются один раз на строку, в кадр идёт одна
# крупная запись вместо тысяч мелких, кадровый буфер отображен с кэшированием.
# Панели и проверки сохранены: debug-assertions, overflow-checks и
# cfg(debug_assertions) работают.
[profile.dev]
panic = "abort"
debug = true
opt-level = 2
debug-assertions = true
overflow-checks = true
incremental = false

[profile.release]
panic = "abort"
