set timeout=0
set default=0
# Видеорежим подбирает GRUB сам по EDID монитора. За это отвечает multiboot2
# header-тег типа 5 в src/boot.asm: он просит загрузчик выставить графический
# режим и передать ядру тег 8 (адрес/разрешение/pitch/bpp/маски цветов).
# Команды gfxmode/gfxpayload/gfxterm на это не влияют, поэтому не нужны.
menuentry "VitaminOS26" {
    multiboot2 /boot/vitamin_os26.elf
    boot
}